name: primeria-pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  primerio-job:
    name: "Primerio Job"
    runs-on: ubuntu-latest
    steps:
      - name: Primeria action
        run: echo "Running Primeria action"
      - name: segunda action
        run: |
          echo "Running segunda action"
          echo "This is a multi-line command"

  setup-basico:
    name: "Setup Basico"
    runs-on: ubuntu-latest
    needs: primerio-job
    steps:
      - name: "Verificação versão do node"
        run: node -v
      - name: "Checkout codigo"
        uses: actions/checkout@v7
        with:
          node-version: '26.13.0'
      - name: "Verificação versão do node pós checkout"
        run: node -v

        